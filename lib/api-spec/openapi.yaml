openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /aria/context:
    get:
      operationId: getAriaContext
      tags: [aria]
      summary: Get the guest's saved concierge context
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      responses:
        "200":
          description: Saved guest preferences and language context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaContext"
    put:
      operationId: updateAriaContext
      tags: [aria]
      summary: Save guest preferences and language context
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaContextInput"
      responses:
        "200":
          description: Updated concierge context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaContext"
  /aria/recommendations:
    post:
      operationId: createAriaRecommendations
      tags: [aria]
      summary: Generate personalized resort recommendations or an itinerary
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaRecommendationsInput"
      responses:
        "200":
          description: Personalized recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaRecommendationsResponse"
  /aria/actions:
    get:
      operationId: listAriaActions
      tags: [aria]
      summary: List guest action requests
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      responses:
        "200":
          description: Guest action requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AriaAction"
    post:
      operationId: createAriaAction
      tags: [aria]
      summary: Create a reservation or concierge action request
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaActionInput"
      responses:
        "201":
          description: Action request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaAction"
  /aria/actions/{id}:
    patch:
      operationId: updateAriaAction
      tags: [aria]
      summary: Cancel a pending guest request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/AriaSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaActionUpdate"
      responses:
        "200":
          description: Updated guest request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaAction"
  /aria/knowledge/search:
    post:
      operationId: searchAriaKnowledge
      tags: [aria]
      summary: Search verified resort guest information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaKnowledgeInput"
      responses:
        "200":
          description: Grounded answer and matching resort sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaKnowledgeResponse"
  /aria/vision:
    post:
      operationId: analyzeAriaImage
      tags: [aria]
      summary: Analyze an uploaded image for resort assistance
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaVisionInput"
      responses:
        "200":
          description: Image analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaVisionResponse"
  /aria/transcribe:
    post:
      operationId: transcribeAriaAudio
      tags: [aria]
      summary: Transcribe a guest voice message
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaAudioInput"
      responses:
        "200":
          description: Transcribed voice message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaTranscription"
  /aria/speak:
    post:
      operationId: synthesizeAriaSpeech
      tags: [aria]
      summary: Turn Aria's response into speech
      parameters:
        - $ref: "#/components/parameters/AriaSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AriaSpeakInput"
      responses:
        "200":
          description: Audio response
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
components:
  parameters:
    AriaSessionHeader:
      name: x-session-id
      in: header
      required: false
      description: Required for guests; authenticated account ID is used when signed in.
      schema:
        type: string
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AriaContext:
      type: object
      required: [language, preferences, interests, travelParty]
      properties:
        language:
          type: string
        preferences:
          type: array
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        dietaryNeeds:
          type: [string, "null"]
        travelParty:
          type: [string, "null"]
        stayDates:
          type: [string, "null"]
    AriaContextInput:
      type: object
      properties:
        language: { type: string }
        preferences:
          type: array
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        dietaryNeeds: { type: [string, "null"] }
        travelParty: { type: [string, "null"] }
        stayDates: { type: [string, "null"] }
    AriaRecommendationsInput:
      type: object
      required: [request]
      properties:
        request: { type: string, minLength: 1 }
        category:
          type: string
          enum: [dining, rooms, wellness, sports, family, itinerary, local]
        days: { type: integer, minimum: 1, maximum: 14 }
    AriaRecommendation:
      type: object
      required: [title, description, category]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        timing: { type: [string, "null"] }
        actionType: { type: [string, "null"] }
    AriaRecommendationsResponse:
      type: object
      required: [title, summary, items]
      properties:
        title: { type: string }
        summary: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AriaRecommendation"
    AriaActionInput:
      type: object
      required: [type, title, details]
      properties:
        type:
          type: string
          enum: [reservation, room-service, spa, dining, transport, activity, human-concierge]
        title: { type: string }
        details: { type: string }
        preferredTime: { type: [string, "null"] }
    AriaAction:
      type: object
      required: [id, type, title, details, status, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        details: { type: string }
        preferredTime: { type: [string, "null"] }
        status:
          type: string
          enum: [requested, confirmed, in-progress, completed, cancelled]
        createdAt:
          type: string
          format: date-time
    AriaActionUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [cancelled]
    AriaKnowledgeInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
    AriaKnowledgeSource:
      type: object
      required: [id, title, source]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
    AriaKnowledgeResponse:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AriaKnowledgeSource"
    AriaVisionInput:
      type: object
      required: [imageDataUrl]
      properties:
        imageDataUrl:
          type: string
          maxLength: 8000000
          description: Base64 data URL for a JPEG, PNG, or WebP image.
        prompt: { type: string }
    AriaVisionResponse:
      type: object
      required: [summary, suggestions]
      properties:
        summary: { type: string }
        suggestions:
          type: array
          items: { type: string }
        detectedLanguage: { type: [string, "null"] }
    AriaAudioInput:
      type: object
      required: [audioBase64]
      properties:
        audioBase64:
          type: string
          maxLength: 8000000
        language: { type: string }
    AriaTranscription:
      type: object
      required: [text, language]
      properties:
        text: { type: string }
        language: { type: string }
    AriaSpeakInput:
      type: object
      required: [text]
      properties:
        text: { type: string }
        language: { type: string }
